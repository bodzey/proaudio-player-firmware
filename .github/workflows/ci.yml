name: Firmware CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout firmware repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install "pytest>=8,<9"

      - name: Validate shell scripts
        run: bash -n scripts/*.sh

      - name: Run repository-owned tests
        run: >-
          python -m pytest -q
          tests/test_build_tooling.py
          tests/test_runtime_recovery.py
