name: Firmware CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout firmware repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install "pytest>=8,<9"

      - name: Validate shell scripts
        run: bash -n scripts/*.sh

      - name: Run build tooling tests
        run: python -m pytest -q tests/test_build_tooling.py

      - name: Run repository-owned recovery tests
        run: >-
          python -m pytest -q tests/test_runtime_recovery.py
          -k "not spotify_uses_single_generic_unity_gain_config"
