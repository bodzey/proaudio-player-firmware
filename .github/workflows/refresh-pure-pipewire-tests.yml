name: Refresh pure-PipeWire contract tests

on:
  push:
    branches: [feature/pure-pipewire]

permissions:
  contents: write

jobs:
  refresh-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/pure-pipewire

      - name: Update stale Pulse-era assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/test_firmware_assets.py")
          text = path.read_text()
          old = '    assert "--no-default-features --features pulseaudio_backend" in makefile\n'
          new = (
              '    assert "--no-default-features --features alsa_backend,dbus_mpris" in makefile\n'
              '    assert "pulseaudio_backend" not in makefile\n'
          )
          if old not in text:
              raise SystemExit("spotify Pulse-era assertion was not found")
          path.write_text(text.replace(old, new))

          path = Path("tests/test_native_webui_packaging.py")
          text = path.read_text()
          replacements = {
              '    assert \'load_loopback_into music_loop "$MUSIC_SINK" "$MASTER_SINK"\' in buses\n':
                  '    assert \'link_stereo "$MUSIC_SINK" "$MASTER_SINK"\' in buses\n',
              '    assert \'load_loopback_into alert_loop "$ALERT_SINK" "$MASTER_SINK"\' in buses\n':
                  '    assert \'link_stereo "$ALERT_SINK" "$MASTER_SINK"\' in buses\n',
              '    assert \'load_loopback_into output_loop "$MASTER_SINK" "$output_target"\' in buses\n':
                  '    assert \'link_stereo "$MASTER_SINK" "$output_target"\' in buses\n',
              '    assert \'GRAPH_UNITY_DB="0.0"\' in buses\n':
                  '    assert "GRAPH_BACKEND=pipewire" in buses\n',
              '    assert "proaudio-player-final-output" in buses\n':
                  '    assert "pw-link" in buses\n    assert "pactl" not in buses\n',
              '    assert \'pactl set-sink-volume "$physical" 100%\' in buses\n':
                  '    assert \'wpctl set-volume "$id" 1.0\' in buses\n    assert "pactl" not in buses\n',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"stale assertion not found: {old.strip()}")
              text = text.replace(old, new)
          path.write_text(text)
          PY

          git diff --check
          git diff -- tests/test_firmware_assets.py tests/test_native_webui_packaging.py

      - name: Commit updated contracts
        run: |
          if git diff --quiet -- tests/test_firmware_assets.py tests/test_native_webui_packaging.py; then
            echo "Contract tests are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_firmware_assets.py tests/test_native_webui_packaging.py
          git commit -m "tests: follow pure PipeWire audio graph"
          git push origin HEAD:feature/pure-pipewire
