context.properties = {
    support.dbus = false
    module.portal = false

    # 48 kHz is the fallback clock, not a permanent lock. Common 44.1/48 kHz
    # families are available so an idle graph/device can follow the active
    # programme stream without an avoidable sample-rate conversion.
    default.clock.rate = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 ]
    settings.check-rate = true
}
