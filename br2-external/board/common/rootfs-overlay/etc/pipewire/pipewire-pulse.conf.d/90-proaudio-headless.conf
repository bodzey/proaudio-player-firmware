context.properties = {
    support.dbus = false
    module.portal = false
}

pulse.properties = {
    # Keep the Pulse compatibility boundary high precision. Individual ALSA
    # devices still negotiate their best supported integer/container format.
    pulse.default.format = F32
}

stream.properties = {
    # Conversion remains a compatibility fallback when source and graph/device
    # rates cannot match. Prefer a high-quality PipeWire resampler in that case.
    resample.quality = 10
}
