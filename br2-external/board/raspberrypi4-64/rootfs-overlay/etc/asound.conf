# ProAudio Player source endpoints.
#
# External engines that only expose ALSA use PipeWire's ALSA plugin so they
# still enter the same PipeWire graph. These PCMs are not hardware devices;
# playback_node selects the logical ProAudio PipeWire target by node.name.

pcm.proaudio_music {
    type pipewire
    playback_node "proaudio_player_music"
    hint {
        show on
        description "ProAudio Player Music Bus"
    }
}

pcm.proaudio_alert {
    type pipewire
    playback_node "proaudio_player_alert"
    hint {
        show on
        description "ProAudio Player Alert Bus"
    }
}
